name: Java Build & Compilation Check

on:
  push:
    branches: [ "main", "feature/**" ]
    paths:
      - "pulse-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "pulse-backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pulse-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'pulse-backend/pom.xml'

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Verify Compilation & Package
        run: ./mvnw clean package -DskipTests
